<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #444;
        line-height: 1.4;
      }
      label {
        font-size: 11px;
        font-weight: 600;
        display: block;
        margin-top: 10px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        font-size: 12px;
        margin-top: 4px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      #status {
        font-size: 11px;
        margin-top: 6px;
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>AI Image Checker</h1>
    <p>
      Click the "AI?" badge on any image on Instagram or TikTok (web) to
      check it.
    </p>
    <label for="backendUrl">Backend server URL</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:3000/detect" />
    <button id="save">Save</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
